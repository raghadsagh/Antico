<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقييم انتيكو</title>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --brown:#6b4a3a;
      --green:#788a4f;
      --paper:#f7f2ea; /* نفس صفحة المنيو */
    }

    body{
      margin:0;
      font-family:'Amiri', serif;
      background:linear-gradient(180deg, var(--paper) 0%, #efe9e1 100%); /* نفس شاشة المنيو */
      padding:24px;
      color:#3f2b23;
    }

    h1{
      text-align:center;
      font-size:34px;
      margin-bottom:20px;
      color:var(--brown);
      font-weight:700;
    }

    .rating-box{
      background:#ffffffee;
      padding:22px;
      border-radius:14px;
      max-width:450px;
      margin:0 auto;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
      text-align:center;
    }

    .stars{
      display:flex;
      justify-content:center;
      gap:10px;
      font-size:42px;
      cursor:pointer;
      margin:18px 0;
    }

    .stars span{
      color:#c8c8c8;
      transition:0.2s;
    }

    .stars span.active{
      color:var(--green);
    }

    textarea{
      width:100%;
      height:110px;
      border-radius:10px;
      border:1px solid #ddd;
      padding:10px;
      font-family:'Amiri', serif;
      font-size:16px;
      resize:none;
    }

    button{
      margin-top:16px;
      padding:10px 16px;
      background:var(--green);
      border:none;
      color:white;
      font-weight:700;
      border-radius:10px;
      cursor:pointer;
      width:100%;
      font-size:17px;
    }

    a.back{
      display:block;
      margin-top:20px;
      text-align:center;
      text-decoration:none;
      color:white;
      background:var(--brown);
      padding:10px;
      border-radius:10px;
      font-weight:700;
      box-shadow:0 6px 15px rgba(107,74,58,0.20);
    }
  </style>
</head>
<body>

  <h1>قيّم تجربتك في انتيكو</h1>

  <div class="rating-box">
    <div class="stars" id="stars">
      <span data-value="1">★</span>
      <span data-value="2">★</span>
      <span data-value="3">★</span>
      <span data-value="4">★</span>
      <span data-value="5">★</span>
    </div>

    <textarea id="feedback" placeholder="اكتب ملاحظاتك أو رأيك هنا..."></textarea>

    <button onclick="submitRating()">إرسال التقييم</button>
  </div>

  <a href="index.html" class="back">العودة للصفحة الرئيسية</a>

  <script>
    const stars = document.querySelectorAll('#stars span');
    let rating = 0;

    stars.forEach(star => {
      star.addEventListener('click', () => {
        rating = star.getAttribute('data-value');
        stars.forEach(s => s.classList.remove('active'));
        for(let i = 0; i < rating; i++){
          stars[i].classList.add('active');
        }
      });
    });

    function submitRating(){
      const text = document.getElementById('feedback').value;
      if(rating === 0){
        alert('الرجاء اختيار عدد النجوم أولاً');
        return;
      }
      alert('تم إرسال تقييمك. شكرًا لك!');
    }
  </script>

</body>
</html>
