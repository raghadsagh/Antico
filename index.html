<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>انتيكو — المقهى</title>

  <link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    :root{
      --antique-brown: #6b4a3a;
      --menu-green: #788a4f;
      --paper: #f7f2ea;
      --accent-dark: #3f2b23;
      --card-shadow: 0 8px 20px rgba(51,40,35,0.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;padding:24px;font-family:'Amiri',serif;
      background:linear-gradient(180deg,var(--paper),#efe9e1);
      color:var(--accent-dark);
    }
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:14px}
    .logo{
      background:linear-gradient(135deg,var(--antique-brown),var(--menu-green));
      -webkit-background-clip:text;color:transparent;
      font-family:'Rakkas',cursive;font-size:48px;letter-spacing:2px;
    }
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px}
    .card{
      background:linear-gradient(180deg,#ffffffdd,#ffffffd0);
      border-radius:14px;padding:18px 16px;display:flex;align-items:center;gap:12px;
      box-shadow:var(--card-shadow);
      transition:.22s;cursor:pointer;
    }
    .card:hover{transform:translateY(-6px)}
    .icon-wrap{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;font-size:22px;color:white}
    .icon-menu{background:var(--menu-green)}
    .icon-about{background:var(--antique-brown)}
    .icon-map{background:#b88f6b}
    .icon-rating{background:#8aa56a}
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <div class="logo">انتيكو</div>
      <div class="tagline">مقهى أنتيك — طابع قديم</div>
    </div>
  </header>

  <main>
    <section class="controls">

      <!-- المنيو -->
      <article class="card" onclick="location.href='menu.html'">
        <div class="icon-wrap icon-menu">🍽️</div>
        <div><h3>المنيو</h3><p>اكتشف مشروباتنا</p></div>
      </article>

      <!-- من نحن -->
      <article class="card" onclick="location.href='about.html'">
        <div class="icon-wrap icon-about">🏺</div>
        <div><h3>من نحن</h3><p>قصة المقهى والرؤية</p></div>
      </article>

      <!-- الموقع -->
      <article class="card" onclick="location.href='location.html'">
        <div class="icon-wrap icon-map">📍</div>
        <div><h3>الموقع على الخريطة</h3><p>اضغط للعرض</p></div>
      </article>

      <!-- التقييم -->
      <article class="card" onclick="location.href='rating.html'">
        <div class="icon-wrap icon-rating">⭐</div>
        <div><h3>تقييم المقهى</h3><p>اختر عدد النجوم</p></div>
      </article>

    </section>
  </main>

</body>
</html>
